name: XeLaTeX smoke tests
on:
  push:
  pull_request:
jobs:
  xelatex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install TeX and example fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-xetex texlive-latex-recommended \
            fonts-noto-cjk fonts-hosny-amiri fonts-liberation poppler-utils
      - name: Compile tests and examples
        run: bash tests/run-tests.sh
